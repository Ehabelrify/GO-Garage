<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">GO Stores brand identity sheet</title>
  <desc id="desc">Production-oriented logo variants, palette, spacing and usage overview.</desc>
  <rect width="1600" height="1200" fill="#F6F4EF"/>
  <text x="80" y="80" fill="#17191D" font-family="Arial, sans-serif" font-size="46" font-weight="700">GO STORES — BRAND IDENTITY</text>
  <text x="80" y="120" fill="#555A5F" font-family="Arial, sans-serif" font-size="21">Master brand for customer-facing communication and the operations application</text>
  <rect x="80" y="160" width="930" height="320" rx="20" fill="#FFFFFF" stroke="#D6D4CF"/>
  <image href="assets/logo-primary.svg" x="125" y="205" width="840" height="250"/>
  <text x="1040" y="205" fill="#17191D" font-family="Arial, sans-serif" font-size="26" font-weight="700">PRIMARY</text>
  <text x="1040" y="244" fill="#555A5F" font-family="Arial, sans-serif" font-size="18">Light backgrounds</text>
  <text x="1040" y="282" fill="#555A5F" font-family="Arial, sans-serif" font-size="18">Transparent SVG</text>
  <text x="1040" y="320" fill="#555A5F" font-family="Arial, sans-serif" font-size="18">Minimum width: 160 px</text>
  <text x="1040" y="358" fill="#555A5F" font-family="Arial, sans-serif" font-size="18">Clear space: turbine radius</text>
  <rect x="80" y="515" width="930" height="300" rx="20" fill="#17191D"/>
  <image href="assets/logo-reversed.svg" x="125" y="540" width="840" height="250"/>
  <text x="1040" y="560" fill="#17191D" font-family="Arial, sans-serif" font-size="26" font-weight="700">REVERSED</text>
  <text x="1040" y="599" fill="#555A5F" font-family="Arial, sans-serif" font-size="18">Graphite / photo-dark fields</text>
  <text x="1040" y="637" fill="#555A5F" font-family="Arial, sans-serif" font-size="18">Never place on busy detail</text>
  <rect x="1065" y="680" width="170" height="170" rx="36" fill="#17191D"/>
  <image href="assets/app-icon.svg" x="1065" y="680" width="170" height="170"/>
  <image href="assets/mark-primary.svg" x="1270" y="700" width="250" height="145"/>
  <text x="1065" y="884" fill="#17191D" font-family="Arial, sans-serif" font-size="20" font-weight="700">APP ICON</text>
  <text x="1270" y="884" fill="#17191D" font-family="Arial, sans-serif" font-size="20" font-weight="700">COMPACT MARK</text>
  <g font-family="Arial, sans-serif" transform="translate(80 920)">
    <g><rect width="260" height="110" rx="14" fill="#17191D"/><text y="145" fill="#17191D" font-size="18" font-weight="700">Graphite</text><text y="172" fill="#555A5F" font-size="17">#17191D</text></g>
    <g transform="translate(285)"><rect width="260" height="110" rx="14" fill="#C82127"/><text y="145" fill="#17191D" font-size="18" font-weight="700">Performance Red</text><text y="172" fill="#555A5F" font-size="17">#C82127</text></g>
    <g transform="translate(570)"><rect width="260" height="110" rx="14" fill="#F3B61F"/><text y="145" fill="#17191D" font-size="18" font-weight="700">Yellow-Gold</text><text y="172" fill="#555A5F" font-size="17">#F3B61F</text></g>
    <g transform="translate(855)"><rect width="260" height="110" rx="14" fill="#B9BEC4"/><text y="145" fill="#17191D" font-size="18" font-weight="700">Brushed Silver</text><text y="172" fill="#555A5F" font-size="17">#B9BEC4</text></g>
    <g transform="translate(1140)"><rect width="260" height="110" rx="14" fill="#FFFFFF" stroke="#D6D4CF"/><text y="145" fill="#17191D" font-size="18" font-weight="700">Warm White</text><text y="172" fill="#555A5F" font-size="17">#F6F4EF</text></g>
  </g>
  <text x="80" y="1155" fill="#555A5F" font-family="Arial, sans-serif" font-size="17">Everyday identity: red + graphite/white. Yellow-gold: selected, attention and premium details only. Crown: premium campaigns only.</text>
</svg>
