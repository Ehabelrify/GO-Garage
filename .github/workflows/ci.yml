name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  database-integration:
    name: Database integration (disposable Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: garage_ci
          POSTGRES_PASSWORD: garage_ci
          POSTGRES_DB: garage_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garage_ci -d garage_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Points only at the throwaway service container above.
      GARAGE_TEST_DATABASE_URL: postgresql://garage_ci:garage_ci@localhost:5432/garage_ci_test
      # Customer QR codes are derived from this secret; the integration suites create and read codes with it.
      WARRANTY_QR_SECRET: ci-only-integration-warranty-qr-secret  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations to the service database
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.GARAGE_TEST_DATABASE_URL }}
      # The same three steps the Replit guide (docs/operations/REPLIT_FRESH_PREVIEW.md) gives, run here against the throwaway
      # database so a seed row that breaks a CHECK, a trigger or a foreign key fails CI instead of failing on Replit.
      # It seeds and then purges, so the integration suites below start from the same empty-of-sample-data database as before.
      # A purge that cannot remove a seeded table in order (foreign key) also fails here.
      - name: Seed, then purge, the sample data (constraint check)
        run: |
          npm run db:seed:dev
          GARAGE_CONFIRM_PURGE=yes npm run db:purge:demo -- --execute --keep-demo-accounts
        env:
          DATABASE_URL: ${{ env.GARAGE_TEST_DATABASE_URL }}
          GARAGE_DATASET_CLASS: scenario
          GARAGE_SEED_NOW: "2026-11-21T10:00:00Z"
      # Serial on purpose: the rehearsal suite snapshots global booking/job counts, and the other suites create and delete
      # bookings in the same database, so running the files in parallel makes the snapshot flaky.
      - name: Run integration suites
        run: >-
          npx vitest run --no-file-parallelism
          apps/server/features/commercial/commercial-migration-rehearsal.integration.test.ts
          apps/server/features/warranty/warranty-ledger.integration.test.ts
          apps/server/features/whatsapp/whatsapp.integration.test.ts
          apps/server/features/invoicing/invoice-payment.integration.test.ts
          apps/server/features/invoicing/customer-purchases-view.integration.test.ts
          apps/server/features/operations/booking-create.integration.test.ts
          apps/server/features/operations/bootstrap.integration.test.ts
          apps/server/features/auth/reclaim-invitation.integration.test.ts
          apps/server/features/reminders/reminders.integration.test.ts
          apps/server/features/audit/staff-customer-audit.integration.test.ts
          apps/server/features/document-delivery/document-delivery.integration.test.ts
